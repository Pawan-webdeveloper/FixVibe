<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- The mark as the hero's primary button: ink plate, brand-coloured arc. A
       white plate would vanish against a light browser tab. An asset file
       cannot read the CSS custom properties, so these are the one place the
       hero's two values are repeated; change them with --brand in globals.css. -->
  <rect width="24" height="24" fill="#050505"/>
  <g transform="rotate(-90 12 12)">
    <circle cx="12" cy="12" r="9" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="3"/>
    <circle cx="12" cy="12" r="9" fill="none" stroke="#ffffff" stroke-width="3"
            stroke-linecap="round" stroke-dasharray="40.7 56.5"/>
  </g>
</svg>
